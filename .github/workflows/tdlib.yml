name: Build tdlib (Alpine)

# Собирает бинарник с tdlib (режим user) под Alpine/musl вместе с libtdjson.so.
# Запускается сам, когда в main меняется архив проекта (*.zip), или вручную: Actions -> Build tdlib (Alpine) -> Run workflow.
# Первая сборка 20-40 минут, дальше быстрее (кэш). Готовая сборка публикуется в Releases: сервер с update.github_repo
# находит её сам (update.auto = true ставит сразу, иначе /update в админ-боте).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.zip']

permissions:
  contents: write

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: for z in ./*.zip; do unzip -q -o "$z"; done
      - uses: actions/cache/restore@v4
        with:
          path: td-install
          key: tdlib-alpine-v1
      - name: Build tdlib and reina in Alpine
        run: |
          mkdir -p td-install out
          docker run --rm -v "$PWD:/w" -w /w golang:1.27-alpine sh -ec '
            apk add --no-cache build-base cmake git gperf openssl-dev zlib-dev linux-headers
            if [ ! -f td-install/lib/libtdjson.so ]; then
              git clone --depth 1 https://github.com/tdlib/td.git /td
              mkdir /td/build && cd /td/build
              cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=/w/td-install ..
              cmake --build . --target install -j"$(nproc)"
            fi
            cd /w/kuni-go
            CGO_ENABLED=1 CGO_LDFLAGS="-L/w/td-install/lib" go build -buildvcs=false -tags tdlib -trimpath -ldflags "-s -w" -o /w/out/reina-tdlib .
            cp /w/td-install/lib/libtdjson.so /w/out/
          '
      # save the (slow to build) tdlib even if the Go build below failed
      - uses: actions/cache/save@v4
        if: always() && hashFiles('td-install/lib/libtdjson.so') != ''
        with:
          path: td-install
          key: tdlib-alpine-v1
      - uses: actions/upload-artifact@v4
        with:
          name: reina-alpine-tdlib
          path: out/*
      - name: Publish the build as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && zip -q ../reina-alpine-tdlib.zip reina-tdlib libtdjson.so && cd ..
          src=$(ls *.zip | grep -v reina-alpine-tdlib | head -1)
          gh release create "build-${{ github.run_number }}" reina-alpine-tdlib.zip \
            --title "Сборка ${{ github.run_number }} (${src%.zip})" \
            --notes "Собрано из ${src} (${{ github.sha }})." --latest
