name: Build tdlib (Alpine)

# Собирает бинарник с tdlib (режим user) под Alpine/musl вместе с libtdjson.so.
# Запуск вручную: Actions -> Build tdlib (Alpine) -> Run workflow. Первая сборка 20-40 минут, дальше быстрее (кэш).
on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: "tdlib commit or tag to build (default: the one reina-core was checked against)"
        required: false
        default: ""

env:
  # tdlib master changes its JSON schema often. This commit (TDLib 1.8.69) is the one the request shapes were
  # validated against (internal/telegram/testdata); reina-core also speaks the 1.8.61-1.8.63 shapes.
  TDLIB_REF: ${{ inputs.tdlib_ref || '9d92b49bc5d0d2e29fe518239af647a88f8680e6' }}

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: for z in ./*.zip; do unzip -q -o "$z"; done
      - uses: actions/cache/restore@v4
        with:
          path: td-install
          key: tdlib-alpine-${{ env.TDLIB_REF }}
      - name: Build tdlib and reina in Alpine
        run: |
          mkdir -p td-install out
          docker run --rm -e TDLIB_REF -v "$PWD:/w" -w /w golang:1.24-alpine sh -ec '
            apk add --no-cache build-base cmake git gperf openssl-dev zlib-dev linux-headers
            if [ ! -f td-install/lib/libtdjson.so ]; then
              git init -q /td && cd /td
              git fetch -q --depth 1 https://github.com/tdlib/td.git "$TDLIB_REF" && git checkout -q FETCH_HEAD
              mkdir /td/build && cd /td/build
              cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=/w/td-install ..
              cmake --build . --target install -j"$(nproc)"
            fi
            SRC=/w/reina-core; [ -f "$SRC/go.mod" ] || SRC=$(dirname "$(find /w -maxdepth 3 -name go.mod -not -path "*/td*" | head -1)")
            cd "$SRC"
            CGO_ENABLED=1 CGO_LDFLAGS="-L/w/td-install/lib" go build -buildvcs=false -tags tdlib -trimpath -ldflags "-s -w" -o /w/out/reina-tdlib .
            cp /w/td-install/lib/libtdjson.so /w/out/
            cp "$SRC/deploy/reina" /w/out/reina && cp "$SRC/deploy/app-add.sh" /w/out/app-add.sh && chmod +x /w/out/reina
          '
      # save the (slow to build) tdlib even if the Go build below failed
      - uses: actions/cache/save@v4
        if: always() && hashFiles('td-install/lib/libtdjson.so') != ''
        with:
          path: td-install
          key: tdlib-alpine-${{ env.TDLIB_REF }}
      - uses: actions/upload-artifact@v4
        with:
          name: reina-alpine-tdlib
          path: out/*
