name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: kuni-go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack kuni-go.zip
        working-directory: .
        run: unzip -q kuni-go.zip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack kuni-go.zip
        working-directory: .
        run: unzip -q kuni-go.zip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Без тега tdlib: режим user недоступен, работают bot и прокси.
      # Для user-режима собирайте локально: go build -tags tdlib (нужна libtdjson).
      - run: |
          ext=""; [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o reina-${{ matrix.goos }}-${{ matrix.goarch }}$ext .
      - uses: actions/upload-artifact@v4
        with:
          name: reina-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kuni-go/reina-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
